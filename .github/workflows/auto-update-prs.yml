name: Auto Update Open PRs

on:
  push:
    branches:
      - main

jobs:
  update-prs:
    name: Update open PRs with main
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
      contents: write
      actions: write
    steps:
      - name: Update Open PRs with main
        uses: actions/github-script@v7
        with:
          script: |
            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'main',
            });

            for (const pr of prs) {
              if (pr.draft) continue;

              const isDependabot =
                pr.user?.login === 'dependabot[bot]' ||
                (pr.user?.login && pr.user.login.includes('dependabot')) ||
                (pr.head?.ref && pr.head.ref.startsWith('dependabot/'));

              if (isDependabot) {
                console.log(`Skipping Dependabot PR #${pr.number} (${pr.head.ref}) per reference-only policy.`);
                continue;
              }

              try {
                console.log(`Updating PR #${pr.number} (${pr.head.ref})...`);
                await github.rest.pulls.updateBranch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                });
                console.log(`Successfully requested branch update for PR #${pr.number}`);

                try {
                  console.log(`Triggering CI workflow dispatch for PR #${pr.number} (${pr.head.ref})...`);
                  await github.rest.actions.createWorkflowDispatch({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    workflow_id: 'ci.yml',
                    ref: pr.head.ref,
                  });
                  console.log(`Successfully dispatched CI workflow for PR #${pr.number}`);
                } catch (dispatchError) {
                  console.error(`Failed to trigger CI dispatch for PR #${pr.number}: ${dispatchError.message}`);
                }
              } catch (error) {
                console.error(`Failed to update PR #${pr.number}: ${error.message}`);
              }
            }
