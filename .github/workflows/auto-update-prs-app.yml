name: Auto Update Open PRs (GitHub App)

on:
  push:
    branches:
      - main

jobs:
  update-prs:
    name: Update open PRs with main
    if: vars.ENABLE_AUTO_UPDATE_PRS == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Create short-lived GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AUTO_UPDATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTO_UPDATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: cfagent
          permission-contents: write
          permission-pull-requests: write

      - name: Update Open PRs with main
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'main',
            });

            for (const pr of prs) {
              const isDependabot =
                pr.user?.login === 'dependabot[bot]' ||
                (pr.user?.login && pr.user.login.includes('dependabot')) ||
                (pr.head?.ref && pr.head.ref.startsWith('dependabot/'));

              if (isDependabot) {
                console.log(`Skipping Dependabot PR #${pr.number} (${pr.head.ref}) per reference-only policy.`);
                continue;
              }

              const baseRepo = `${context.repo.owner}/${context.repo.repo}`;
              if (pr.head?.repo?.full_name !== baseRepo) {
                console.log(`Skipping fork PR #${pr.number} (${pr.head?.repo?.full_name ?? 'deleted fork'}); the App is installed only on ${baseRepo}.`);
                continue;
              }

              try {
                console.log(`Updating PR #${pr.number} (${pr.head.ref})...`);
                await github.rest.pulls.updateBranch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                });
                console.log(`Successfully requested branch update for PR #${pr.number}`);
              } catch (error) {
                console.error(`Failed to update PR #${pr.number}: ${error.message}`);
              }
            }
