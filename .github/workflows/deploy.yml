name: Deploy AI Search Agent

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target GitHub Environment (overrides environment.config.json)"
        required: false
        default: "CONFIG"
        type: choice
        options:
          - "CONFIG"
          - "PROD"
          - "TEST"

jobs:
  # ── Step 1: read environment.config.json or input to determine target environment ──
  load-environment:
    name: Load Active Environment
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.read-env.outputs.target_env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Active Environment from Config or Input
        id: read-env
        run: |
          INPUT_ENV="${{ github.event.inputs.target_env }}"
          if [ -n "$INPUT_ENV" ] && [ "$INPUT_ENV" != "CONFIG" ]; then
            TARGET_ENV="$INPUT_ENV"
          else
            TARGET_ENV=$(jq -r '.environment' environment.config.json)
          fi
          echo "Active target environment: $TARGET_ENV"
          echo "target_env=$TARGET_ENV" >> $GITHUB_OUTPUT

  # ── Step 2: build & deploy using secrets from the GitHub Environment ──
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy [${{ needs.load-environment.outputs.target_env }}]
    needs: load-environment
    # Links this job to the GitHub Environment (TEST or PROD), pulling its secrets
    environment: ${{ needs.load-environment.outputs.target_env }}
    permissions:
      contents: read

    env:
      APP_ENV: ${{ needs.load-environment.outputs.target_env }}
      ET_API_KEY: ${{ secrets.ET_API_KEY }}
      ET_API_SECRET: ${{ secrets.ET_API_SECRET }}
      ET_BASE_URL: ${{ secrets.ET_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: Run unit & integration test suites
        run: npm run test:ci

      - name: Build frontend
        run: npm run build

      - name: Get or create KV namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          KV_ID=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | jq -r '.result[] | select(.title=="AGENT_SESSIONS") | .id' 2>/dev/null || echo "")

          if [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ]; then
            echo "Creating AGENT_SESSIONS namespace via API..."
            CREATE_RESP=$(curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"title":"AGENT_SESSIONS"}')
            echo "Create response: $CREATE_RESP"
            KV_ID=$(echo "$CREATE_RESP" | jq -r '.result.id' 2>/dev/null || echo "")
          fi

          if [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ]; then
            echo "Failed to get or create KV namespace"
            exit 1
          fi

          echo "KV namespace ID: $KV_ID"
          echo "KV_ID=$KV_ID" >> $GITHUB_ENV

      - name: Update wrangler.jsonc with KV ID
        run: sed -i "s/<YOUR_KV_NAMESPACE_ID>/$KV_ID/g" wrangler.jsonc

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Set core secrets on Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          GH_ID="${{ secrets.GH_CLIENT_ID || secrets.GITHUB_CLIENT_ID }}"
          GH_SEC="${{ secrets.GH_CLIENT_SECRET || secrets.GITHUB_CLIENT_SECRET }}"
          APP_URL="${{ secrets.APP_BASE_URL }}"
          SESS_SEC="${{ secrets.SESSION_SECRET }}"

          if [ -n "$GH_ID" ]; then printf "%s" "$GH_ID" | npx wrangler secret put GITHUB_CLIENT_ID; fi
          if [ -n "$GH_SEC" ]; then printf "%s" "$GH_SEC" | npx wrangler secret put GITHUB_CLIENT_SECRET; fi
          if [ -n "$APP_URL" ]; then printf "%s" "$APP_URL" | npx wrangler secret put APP_BASE_URL; fi
          if [ -n "$SESS_SEC" ]; then printf "%s" "$SESS_SEC" | npx wrangler secret put SESSION_SECRET; fi

      - name: Set E*TRADE secrets on Cloudflare Worker [${{ needs.load-environment.outputs.target_env }}]
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          # Resolve E*TRADE credentials from active GitHub Environment (or repo fallbacks)
          TARGET_KEY="${{ secrets.ET_API_KEY || secrets.ETRADE_API_KEY || secrets.ET_PROD_API_KEY || secrets.PROD_ET_API_KEY || secrets.ETRADE_CONSUMER_KEY || secrets.ET_KEY }}"
          TARGET_SEC="${{ secrets.ET_API_SECRET || secrets.ETRADE_API_SECRET || secrets.ET_PROD_API_SECRET || secrets.PROD_ET_API_SECRET || secrets.ETRADE_CONSUMER_SECRET || secrets.ET_SECRET }}"
          ACTIVE_ENV="${{ needs.load-environment.outputs.target_env }}"

          if [ "$ACTIVE_ENV" = "PROD" ]; then
            DEFAULT_BASE="https://api.etrade.com/v1"
          else
            DEFAULT_BASE="https://apisb.etrade.com/v1"
          fi

          TARGET_URL="${{ secrets.ET_BASE_URL || secrets.ETRADE_BASE_URL }}"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="$DEFAULT_BASE"
          fi

          if [ -n "$TARGET_KEY" ]; then
            printf "%s" "$TARGET_KEY" | npx wrangler secret put ET_API_KEY
          fi
          if [ -n "$TARGET_SEC" ]; then
            printf "%s" "$TARGET_SEC" | npx wrangler secret put ET_API_SECRET
          fi
          if [ -n "$TARGET_URL" ]; then
            printf "%s" "$TARGET_URL" | npx wrangler secret put ET_BASE_URL
          fi
          printf "%s" "$ACTIVE_ENV" | npx wrangler secret put APP_ENV

      - name: Set Payment Gateway secrets on Cloudflare Worker [${{ needs.load-environment.outputs.target_env }}]
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          PAYPAL_ENVIRONMENT: ${{ secrets.PAYPAL_ENVIRONMENT }}
          LEMONSQUEEZY_API_KEY: ${{ secrets.LEMONSQUEEZY_API_KEY }}
          LEMONSQUEEZY_STORE_ID: ${{ secrets.LEMONSQUEEZY_STORE_ID }}
          LEMONSQUEEZY_WEBHOOK_SECRET: ${{ secrets.LEMONSQUEEZY_WEBHOOK_SECRET }}
        run: |
          if [ -n "$STRIPE_SECRET_KEY" ]; then printf "%s" "$STRIPE_SECRET_KEY" | npx wrangler secret put STRIPE_SECRET_KEY; fi
          if [ -n "$STRIPE_WEBHOOK_SECRET" ]; then printf "%s" "$STRIPE_WEBHOOK_SECRET" | npx wrangler secret put STRIPE_WEBHOOK_SECRET; fi
          if [ -n "$PAYPAL_CLIENT_ID" ]; then printf "%s" "$PAYPAL_CLIENT_ID" | npx wrangler secret put PAYPAL_CLIENT_ID; fi
          if [ -n "$PAYPAL_CLIENT_SECRET" ]; then printf "%s" "$PAYPAL_CLIENT_SECRET" | npx wrangler secret put PAYPAL_CLIENT_SECRET; fi
          if [ -n "$PAYPAL_ENVIRONMENT" ]; then printf "%s" "$PAYPAL_ENVIRONMENT" | npx wrangler secret put PAYPAL_ENVIRONMENT; fi
          if [ -n "$LEMONSQUEEZY_API_KEY" ]; then printf "%s" "$LEMONSQUEEZY_API_KEY" | npx wrangler secret put LEMONSQUEEZY_API_KEY; fi
          if [ -n "$LEMONSQUEEZY_STORE_ID" ]; then printf "%s" "$LEMONSQUEEZY_STORE_ID" | npx wrangler secret put LEMONSQUEEZY_STORE_ID; fi
          if [ -n "$LEMONSQUEEZY_WEBHOOK_SECRET" ]; then printf "%s" "$LEMONSQUEEZY_WEBHOOK_SECRET" | npx wrangler secret put LEMONSQUEEZY_WEBHOOK_SECRET; fi
