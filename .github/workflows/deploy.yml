      - name: Get or create KV namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          # Try to find existing AGENT_SESSIONS namespace
          KV_ID=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | jq -r '.result[] | select(.title=="AGENT_SESSIONS") | .id' 2>/dev/null || echo "")

          if [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ]; then
            echo "Creating AGENT_SESSIONS namespace via API..."
            CREATE_RESP=$(curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"title":"AGENT_SESSIONS"}')
            echo "Create response: $CREATE_RESP"
            KV_ID=$(echo "$CREATE_RESP" | jq -r '.result.id' 2>/dev/null || echo "")
          fi

          if [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ]; then
            echo "Failed to get or create KV namespace"
            exit 1
          fi

          echo "KV namespace ID: $KV_ID"
          echo "KV_ID=$KV_ID" >> $GITHUB_ENV
