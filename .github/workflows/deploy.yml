name: Deploy AI Search Agent

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ── Step 1: read environment.config.json to determine target environment ──
  load-environment:
    name: Load Active Environment
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.read-env.outputs.target_env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Active Environment from Config
        id: read-env
        run: |
          TARGET_ENV=$(jq -r '.environment' environment.config.json)
          echo "Active environment: $TARGET_ENV"
          echo "target_env=$TARGET_ENV" >> $GITHUB_OUTPUT

  # ── Step 2: build & deploy using secrets from the GitHub Environment ──
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy [${{ needs.load-environment.outputs.target_env }}]
    needs: load-environment
    # Links this job to the GitHub Environment (TEST or PROD), pulling its secrets
    environment: ${{ needs.load-environment.outputs.target_env }}
    permissions:
      contents: read

    env:
      APP_ENV: ${{ needs.load-environment.outputs.target_env }}
      ET_API_KEY: ${{ secrets.ET_API_KEY }}
      ET_API_SECRET: ${{ secrets.ET_API_SECRET }}
      ET_BASE_URL: ${{ secrets.ET_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: Run unit & integration test suites
        run: npm run test:ci

      - name: Build frontend
        run: npm run build

      - name: Get or create KV namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          KV_ID=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | jq -r '.result[] | select(.title=="AGENT_SESSIONS") | .id' 2>/dev/null || echo "")

          if [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ]; then
            echo "Creating AGENT_SESSIONS namespace via API..."
            CREATE_RESP=$(curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"title":"AGENT_SESSIONS"}')
            echo "Create response: $CREATE_RESP"
            KV_ID=$(echo "$CREATE_RESP" | jq -r '.result.id' 2>/dev/null || echo "")
          fi

          if [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ]; then
            echo "Failed to get or create KV namespace"
            exit 1
          fi

          echo "KV namespace ID: $KV_ID"
          echo "KV_ID=$KV_ID" >> $GITHUB_ENV

      - name: Update wrangler.jsonc with KV ID
        run: sed -i "s/<YOUR_KV_NAMESPACE_ID>/$KV_ID/" wrangler.jsonc

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Set core secrets on Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "${{ secrets.GH_CLIENT_ID }}" | npx wrangler secret put GITHUB_CLIENT_ID
          echo "${{ secrets.GH_CLIENT_SECRET }}" | npx wrangler secret put GITHUB_CLIENT_SECRET
          echo "${{ secrets.APP_BASE_URL }}" | npx wrangler secret put APP_BASE_URL
          echo "${{ secrets.SESSION_SECRET }}" | npx wrangler secret put SESSION_SECRET

      - name: Set E*TRADE secrets on Cloudflare Worker [${{ needs.load-environment.outputs.target_env }}]
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          # Push E*TRADE credentials from the active GitHub Environment into the Worker
          echo "${{ secrets.ET_API_KEY }}" | npx wrangler secret put ET_API_KEY
          echo "${{ secrets.ET_API_SECRET }}" | npx wrangler secret put ET_API_SECRET
          echo "${{ secrets.ET_BASE_URL }}" | npx wrangler secret put ET_BASE_URL
          # Push the active environment name so the Worker knows its context
          echo "${{ needs.load-environment.outputs.target_env }}" | npx wrangler secret put APP_ENV
