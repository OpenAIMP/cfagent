name: Deploy AI Search Agent

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Get or create KV namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          KV_ID=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | jq -r '.result[] | select(.title=="AGENT_SESSIONS") | .id' 2>/dev/null || echo "")

          if [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ]; then
            echo "Creating AGENT_SESSIONS namespace..."
            KV_ID=$(npx wrangler kv namespace create AGENT_SESSIONS 2>&1 | grep -oP 'id:\s*\K[a-f0-9]+' || echo "")
            if [ -z "$KV_ID" ]; then
              KV_ID=$(npx wrangler kv namespace create AGENT_SESSIONS --json 2>/dev/null | jq -r '.result.id' 2>/dev/null || echo "")
            fi
          fi

          if [ -z "$KV_ID" ]; then echo "Failed to get KV namespace"; exit 1; fi
          echo "KV_ID=$KV_ID" >> $GITHUB_ENV

      - name: Update wrangler.jsonc with KV ID
        run: sed -i "s/<YOUR_KV_NAMESPACE_ID>/$KV_ID/" wrangler.jsonc

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Set secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "${{ secrets.GH_CLIENT_ID }}" | npx wrangler secret put GITHUB_CLIENT_ID
          echo "${{ secrets.GH_CLIENT_SECRET }}" | npx wrangler secret put GITHUB_CLIENT_SECRET
          echo "${{ secrets.APP_BASE_URL }}" | npx wrangler secret put APP_BASE_URL
          echo "${{ secrets.SESSION_SECRET }}" | npx wrangler secret put SESSION_SECRET
