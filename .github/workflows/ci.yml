name: Continuous Integration & Test Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-verify:
    name: Test & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
      fail-fast: false

    permissions:
      contents: read

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 TypeScript Strict Type Check
        run: npm run typecheck

      - name: 🧪 Execute Vitest Test Suites (ORM, NLQ, MCP, Trading, Patterns, Payments)
        run: npm run test:ci

      - name: 🏗️ Verify Frontend Production Bundle Build
        run: npm run build

      - name: 🛡️ Verify Cloudflare Worker Configuration
        run: npx wrangler --version
