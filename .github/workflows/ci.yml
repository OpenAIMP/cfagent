name: Continuous Integration & Test Verification


on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Merge queue validation (gitops §19.5): the queue builds a temporary
  # merge commit of each PR against current main plus earlier queued
  # PRs. Without this trigger that commit runs no checks and the queue
  # gates nothing. Deploy stays push-only: a queued merge that lands
  # triggers deploy via the push event.
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── Step 1: read environment.config.json to determine target environment ──
  load-environment:
    name: Load Active Environment
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.read-env.outputs.target_env }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            environment.config.json

      - name: 🌐 Read Active Environment from Config
        id: read-env
        run: |
          TARGET_ENV=$(jq -r '.environment' environment.config.json)
          echo "Active environment: $TARGET_ENV"
          echo "target_env=$TARGET_ENV" >> $GITHUB_OUTPUT

  # ── Step 2: test with secrets from the GitHub Environment (TEST or PROD) ──
  test-and-verify:
    name: Test & Build (Node ${{ matrix.node-version }}) [${{ needs.load-environment.outputs.target_env }}]
    runs-on: ubuntu-latest
    needs: load-environment
    # Links this job to the GitHub Environment, pulling ET_API_KEY / ET_API_SECRET / ET_BASE_URL
    environment: ${{ needs.load-environment.outputs.target_env }}
    strategy:
      matrix:
        node-version: [22]
      fail-fast: false

    permissions:
      contents: read

    env:
      APP_ENV: ${{ needs.load-environment.outputs.target_env }}
      ET_API_KEY: ${{ secrets.ET_API_KEY }}
      ET_API_SECRET: ${{ secrets.ET_API_SECRET }}
      ET_BASE_URL: ${{ secrets.ET_BASE_URL }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧪 Parallel Verification (TypeCheck, Vitest, Frontend Build, Wrangler)
        run: |
          npx wrangler --version &
          PID_WRANGLER=$!

          npm run typecheck &
          PID_TYPECHECK=$!

          npm run build &
          PID_BUILD=$!

          npm run test:ci &
          PID_TEST=$!

          wait $PID_WRANGLER || exit 1
          wait $PID_TYPECHECK || exit 1
          wait $PID_BUILD || exit 1
          wait $PID_TEST || exit 1
