name: Continuous Integration & Test Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Step 1: read environment.config.json to determine target environment ──
  load-environment:
    name: Load Active Environment
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.read-env.outputs.target_env }}
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🌐 Read Active Environment from Config
        id: read-env
        run: |
          TARGET_ENV=$(jq -r '.environment' environment.config.json)
          echo "Active environment: $TARGET_ENV"
          echo "target_env=$TARGET_ENV" >> $GITHUB_OUTPUT

  # ── Step 2: test with secrets from the GitHub Environment (TEST or PROD) ──
  test-and-verify:
    name: Test & Build (Node ${{ matrix.node-version }}) [${{ needs.load-environment.outputs.target_env }}]
    runs-on: ubuntu-latest
    needs: load-environment
    # Links this job to the GitHub Environment, pulling ET_API_KEY / ET_API_SECRET / ET_URL
    environment: ${{ needs.load-environment.outputs.target_env }}
    strategy:
      matrix:
        node-version: [22]
      fail-fast: false

    permissions:
      contents: read

    env:
      APP_ENV: ${{ needs.load-environment.outputs.target_env }}
      ET_API_KEY: ${{ secrets.ET_API_KEY }}
      ET_API_SECRET: ${{ secrets.ET_API_SECRET }}
      ET_URL: ${{ secrets.ET_URL }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 TypeScript Strict Type Check
        run: npm run typecheck

      - name: 🧪 Execute Vitest Test Suites (ORM, NLQ, MCP, Trading, Patterns, Payments)
        run: npm run test:ci

      - name: 🏗️ Verify Frontend Production Bundle Build
        run: npm run build

      - name: 🛡️ Verify Cloudflare Worker Configuration
        run: npx wrangler --version
