# Auto-merge eligible PRs — issue #1509.
#
# WHAT: automatically applies `auto-merge` and enables GitHub auto-merge
# (rebase only) for eligible non-draft PRs targeting main.
# Enabling auto-merge merges NOTHING by itself: GitHub merges only
# when every requirement passes (required checks green, conversations
# resolved, and — once the queue is on — queue validation on the
# merge-group commit).
#
# SAFETY: use pull_request_target only to inspect PR metadata, apply a
# label, and request auto-merge. Never check out or execute PR code in
# this privileged workflow. PRs touching .github/workflows/ are excluded
# and require a human merge. Required checks and conversation resolution
# remain enforced by GitHub before any merge can happen.
#
# NOTE: removing the label does NOT disable auto-merge once enabled —
# disable it on the PR page if you change your mind.
#
# No new secrets: uses the built-in GITHUB_TOKEN.
# Prerequisite: General → "Allow auto-merge" must be ON, or PR-level
# auto-merge does not exist at all.

name: Auto-merge trusted PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    branches: [main]

permissions:
  pull-requests: write
  contents: write

jobs:
  enable-auto-merge:
    name: Label eligible PRs and enable auto-merge
    runs-on: ubuntu-24.04
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - name: Label eligible PR and enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')
          if [ -z "$files" ]; then
            echo "Unable to verify changed files — leaving PR for manual handling."
            exit 1
          fi
          if printf '%s\n' "$files" | grep -q '^\.github/workflows/'; then
            echo "PR touches .github/workflows/ — leaving it for manual merge."
            exit 0
          fi
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "auto-merge"
          gh pr merge --auto --rebase --repo "$GITHUB_REPOSITORY" "$PR_NUMBER"
