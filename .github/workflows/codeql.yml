# CodeQL — static application security testing (SAST) for this repo.
#
# Issue #765 (RSI-InfoSec plan #764, P1 DevSecOps), updated in #2499:
# Runs CodeQL's javascript-typescript analysis as an alert-only SAST gate on
# code-touching pull requests and weekly on main, publishing results to the
# repo's code-scanning tab (picked up by secops-findings-watch.yml).
#
# The workflow name matters: anything wired to workflow_run elsewhere must
# match this `name:` exactly.
name: CodeQL

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "changelog.d/**"
      - "*.md"
  merge_group:
  workflow_dispatch:
  schedule:
    # Weekly, Mondays 06:17 UTC — off the hour to avoid the fleet-wide rush.
    - cron: "17 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    # Alert-only SAST (#2499): runs on code-touching PRs and weekly on main;
    # skipped on merge_group so queue merges do not wait 2.5m on a non-required check.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
