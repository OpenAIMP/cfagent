# Secret Scanning (gitleaks) — Assessment P0 item 3, OpenAIMP/cfagent issue #143.
#
# WHAT: scans every commit in the repository (full history) for secrets
# committed by accident. Runs on push to main and on pull requests so
# leaked credentials are caught before they merge.
#
# INSTALL (owner, via the GitHub web UI — the assistant's integration cannot
# write .github/workflows/, 403): create/overwrite .github/workflows/gitleaks.yml
# with exactly this content and commit it to main. No new secrets.
#
# v2 FIX (2026-10-18): gitleaks-action@v2 reads process.env.GITHUB_TOKEN on the
# pull_request path (ScanPullRequest) and hard-fails with "GITHUB_TOKEN is now
# required to scan pull requests" when it is absent — push runs were green,
# PR runs failed in ~1s. The env block below is REQUIRED; contents: read
# permission on the workflow is sufficient (the token is only used to list
# the PR's commits).
#
# FINE-TUNING: if the scan flags false positives, add a .gitleaks.toml
# allowlist at the repo root (see the gitleaks docs); the action picks it
# up automatically.

name: Secret Scanning

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Checkout Repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔎 Scan for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
