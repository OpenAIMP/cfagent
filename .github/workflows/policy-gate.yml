# Policy Gate — cfagent issue #1487.
#
# WHAT: turns gitops policy that is otherwise only prose into a required
# check. A PR merges only if it carries (a) a linked issue, (b) a §21
# lane label, (c) an agent hashtag, and (d) a CHANGELOG entry under
# ## [Unreleased]. A PR that skips any of these fails here even when
# every test is green.
#
# WHY: verified 2026-10-25, the Jules PRs #1006, #1021, #1028, #1061,
# and #1137 each merged with zero labels and no agent hashtag, and
# #1137 with zero issue refs. They landed via merged PRs, not direct
# pushes — the gap was the missing gates, not a bypassed branch rule.
# Shared-account attribution makes this worse: PR user is OpenAIMP
# for every lane, so the label and hashtag are the attribution.
#
# HOW: deterministic and fast. Issue, label, and hashtag come from
# the pull_request event context (no API calls). The CHANGELOG check
# diffs the PR head against the merge base and requires an added
# line inside the ## [Unreleased] section. No secrets, no network
# beyond the checkout.
#
# OWNER STEP: add the job name "Policy Gate" to the protectmain
# ruleset's required checks; until then this workflow runs but does
# not block merges. Draft and workflow-changing PRs run through the
# same policy checks as every other PR.

name: Policy Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-gate:
    name: Policy Gate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch for CHANGELOG comparison
        run: git fetch origin main

      - name: Run policy gate
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          python3 - << 'PYEOF'
          import os
          import re
          import subprocess
          import sys

          body = os.environ.get("PR_BODY") or ""
          title = os.environ.get("PR_TITLE") or ""
          labels = (os.environ.get("PR_LABELS") or "").split()
          text = body + "\n" + title

          failures = []

          # (a) Linked issue: a closing keyword with an issue number,
          # or an explicit cross-repo issue reference.
          if not re.search(
              r"(?i)\b(fixes|closes|resolves)\s+#\d+",
              text,
          ) and not re.search(r"OpenAIMP/cfagent#\d+", text):
              failures.append(
                  "(a) linked issue: PR body/title has no "
                  "'Fixes #N' / 'Closes #N' / 'Resolves #N' "
                  "and no OpenAIMP/cfagent#N reference"
              )

          # (b) §21 lane label: any label of the form lane:<agent-id>.
          if not any(label.startswith("lane:") for label in labels):
              failures.append(
                  "(b) lane label: PR carries no 'lane:*' label "
                  "(see gitops §21)"
              )

          # (c) Agent hashtag: e.g. #CISO-bhdm, #CTO-mbshr.
          if not re.search(r"#[A-Za-z][A-Za-z0-9]*-[A-Za-z0-9]+", body):
              failures.append(
                  "(c) agent hashtag: PR body has no '#<agent>-<id>' "
                  "hashtag (see AGENTS.md hashtag rule)"
              )

          # (d) CHANGELOG entry under ## [Unreleased]: compare the
          # Unreleased section on the base with the one on the PR
          # head. An entry counts only if it is present on the head
          # and absent on the base — mere presence of the section
          # on main is not enough, and diff-hunk context cannot be
          # trusted to show the section header.
          def unreleased_section(text_content):
              lines = text_content.splitlines()
              section = []
              in_section = False
              for line in lines:
                  if line.startswith("## [Unreleased]"):
                      in_section = True
                      continue
                  if in_section and line.startswith("## "):
                      break
                  if in_section:
                      section.append(line)
              return section

          base_text = subprocess.run(
              ["git", "show", "origin/main:CHANGELOG.md"],
              capture_output=True, text=True, check=True,
          ).stdout
          with open("CHANGELOG.md", encoding="utf-8") as handle:
              head_text = handle.read()
          base_lines = {line for line in unreleased_section(base_text)
                        if line.strip()}
          head_lines = unreleased_section(head_text)
          added_entry = any(
              line.strip() and line not in base_lines
              for line in head_lines
          )
          if not added_entry:
              failures.append(
                  "(d) CHANGELOG: PR adds no entry under "
                  "## [Unreleased] in CHANGELOG.md"
              )

          if failures:
              print("Policy gate FAILED:")
              for failure in failures:
                  print("  - " + failure)
              sys.exit(1)
          print("Policy gate passed: linked issue, lane label, "
                "agent hashtag, and CHANGELOG [Unreleased] entry present.")
          PYEOF
