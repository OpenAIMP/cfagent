<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Enterprise Multi-Agent Assistant powered by Cloudflare Agents, Workers AI, RAG Knowledge Search, and SQLite persistence.">
  <title>AI Multi-Agent Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    (function() {
      try {
        var t = localStorage.getItem('nextgentp_theme') || 'system';
        var eff = t === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t;
        document.documentElement.setAttribute('data-theme', eff);
        document.documentElement.setAttribute('data-theme-preference', t);
        document.documentElement.classList.toggle('dark', eff === 'dark');
        document.documentElement.classList.toggle('light', eff === 'light');
        document.documentElement.style.colorScheme = eff;
        var scale = localStorage.getItem('nextgentp_font_scale');
        if (scale) document.documentElement.style.setProperty('--app-font-scale', scale);
        // Universal single font: permanently purge legacy multi-font selection
        localStorage.removeItem('nextgentp_font_style');
        document.documentElement.setAttribute('data-font-style', 'inter');
        document.documentElement.style.setProperty('--font-sans', "'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif");
        var density = localStorage.getItem('nextgentp_density') || 'comfortable';
        document.documentElement.setAttribute('data-density', density);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/client/main.tsx"></script>
</body>
</html>
